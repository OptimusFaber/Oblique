name: Build Oblique
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libcap2-bin
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:core
      - name: Core network regression
        shell: bash
        run: npm run test:core
      - name: Linux TUN regression (isolated network namespaces)
        if: runner.os == 'Linux'
        run: sudo unshare --mount --net -- python3 tests/tun-namespace.py
      - name: Check bundled core
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            src-tauri/resources/oblique-core.exe sing-box version
          else
            src-tauri/resources/oblique-core sing-box version
          fi
      - name: Build installers
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            npm run tauri -- build --bundles nsis
          else
            npm run tauri -- build --bundles deb,appimage
          fi
      - name: Scan Windows binaries with Microsoft Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue)) {
            Write-Warning 'Microsoft Defender cmdlets are unavailable on this runner; antivirus scan was NOT RUN.'
            exit 0
          }
          $status = Get-MpComputerStatus
          if (-not $status.AntivirusEnabled -or -not $status.RealTimeProtectionEnabled) {
            Write-Warning 'Microsoft Defender is unavailable on this runner; antivirus scan was NOT RUN.'
            exit 0
          }
          $files = @('src-tauri/resources/oblique-core.exe', 'src-tauri/target/release/oblique.exe')
          $files += @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | ForEach-Object FullName)
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing Windows artifact: $file" }
            Write-Host "Scanning $file"
            Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $file).Path -ErrorAction Stop
            if (-not (Test-Path $file)) { throw "Defender removed or quarantined $file" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Oblique-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
